# Backend only. The UI lives in its own repo (moviestream-frontend) on Vercel.
#
#   Browser ──> movies.aakashjammula.com      (Vercel: static UI)
#   Browser ──> movies-api.aakashjammula.com  ──> Cloudflare Tunnel ──> backend:8000
#
# FastAPI serves the API *and* the video files (Range requests for seeking), so no
# nginx is needed. Start it when you want MovieStream online:  docker compose up -d
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      MOVIE_DB: /app/data/movies.db
      MOVIE_DIR: /mnt/movies   # a link to /host-media/$MEDIA_SUBDIR, made at container start
      MEDIA_SUBDIR: ${MEDIA_SUBDIR:?Please set MEDIA_SUBDIR in .env (media folder inside MEDIA_ROOT)}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:3000}
    volumes:
      - movie-data:/app/data
      # Mount the folder the drive appears IN (always exists), not the drive itself:
      # - rslave: a drive plugged in later shows up inside the running container
      # - create_host_path: false: Docker never creates a fake empty folder where
      #   the drive should mount (which would push the real drive to ".../Expansion1")
      # Writable: fetched subtitles are saved next to each video.
      - type: bind
        source: ${MEDIA_ROOT:?Please set MEDIA_ROOT in .env (folder your drive mounts in)}
        target: /host-media
        bind:
          propagation: rslave
          create_host_path: false
    ports:
      - "8000:8000" # local access (frontend dev on localhost:3000); internet traffic comes via the tunnel
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    # Tunnel public hostname: movies-api.aakashjammula.com → http://backend:8000
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN:-missing}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  movie-data:
