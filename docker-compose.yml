# Backend only. The UI lives in its own repo (moviestream-frontend) on Vercel.
#
#   Browser ──> movies.aakashjammula.com      (Vercel: static UI)
#   Browser ──> movies-api.aakashjammula.com  ──> Cloudflare Tunnel ──> backend:8000
#
# FastAPI serves the API *and* the video files (Range requests for seeking), so no
# nginx is needed. Start it when you want MovieStream online:  docker compose up -d
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      MOVIE_DB: /app/data/movies.db
      MOVIE_DIR: /mnt/movies
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:3000}
    volumes:
      - movie-data:/app/data
      - ${MEDIA_DIR:?Please set MEDIA_DIR in .env (absolute path to your media folder)}:/mnt/movies # writable: fetched subtitles are saved next to each video
    ports:
      - "8000:8000" # local access (frontend dev on localhost:3000); internet traffic comes via the tunnel
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    # Tunnel public hostname: movies-api.aakashjammula.com → http://backend:8000
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN:-missing}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  movie-data:
