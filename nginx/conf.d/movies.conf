# Reverse proxy: browser -> nginx -> frontend (/) + backend (/api/).
# Video bytes are served by nginx itself (sendfile, zero-copy) after the
# backend authorizes the request via X-Accel-Redirect to /_media/.
# Catch-all server: works behind any domain, tunnel, or direct IP.
# Point your domain (or Cloudflare Tunnel) at this host's port 80.
server {
    listen 80 default_server;
    server_name _;

    sendfile on;
    aio threads;
    directio 512k;
    gzip off;

    # Next.js frontend
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # FastAPI backend. Trailing slashes keep the /api prefix intact.
    # Buffering off + long timeouts: video seeks are long-lived
    # connections that must not be spooled to temp files.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Via-Nginx 1;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Backend health + root without prefix clash.
    location = /health {
        proxy_pass http://backend:8000;
    }

    # Internal media delivery. Only reachable via X-Accel-Redirect
    # from the backend (validates the id); never directly by clients.
    location /_media/ {
        internal;
        alias /mnt/movies/;
        mp4;
        mp4_buffer_size 1m;
        mp4_max_buffer_size 8m;
        expires 1d;
        add_header Accept-Ranges bytes;
    }

    # Firefox-compatible remux cache (MP4 copies built on demand by the
    # backend). Same internal-only pattern as /_media/.
    location /_cache/ {
        internal;
        alias /app/data/remux/;
        expires 30d;
        add_header Accept-Ranges bytes;
    }
}
