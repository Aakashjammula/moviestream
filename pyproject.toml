[project]
name = "moviestream"
version = "0.1.0"
description = "Backend for MovieStream, a self-hosted movie and TV streaming app"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "imageio-ffmpeg",
    "bcrypt",
]

# src/ layout: the package lives in src/moviestream (uv_build's default).
[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv]
managed = true
